<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Together Room Sample</title>
    <link rel="stylesheet" href="./together-sample.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../2-main-explore/main-page-sample.html"><img src="../../src/assets/images/dabom2.png" alt="DaBom" /></a>
        <div class="search-wrap"><input type="text" placeholder="방 내 검색" /><button>검색</button></div>
        <div class="auth-links"><a href="../1-auth/login-sample.html">로그인</a><a href="../1-auth/signup-sample.html">회원가입</a></div>
      </div>
    </header>

    <main class="page-wrap">
      <section class="page-head">
        <div>
          <h1>Together 방</h1>
          <p>프론트엔드 코드리뷰 같이보기 · 참여자 8명</p>
        </div>
        <div class="row">
          <a class="btn" href="./together-main-sample.html">방 목록</a>
          <button class="btn btn-primary">초대 링크 복사</button>
        </div>
      </section>

      <section class="layout-room">
        <article class="card">
          <video class="player" controls poster="../../src/assets/images/banner.png"></video>
          <div class="row" style="margin-top: 10px">
            <button class="btn">재생/일시정지 동기화</button>
            <button class="btn">5초 되감기</button>
            <button class="btn">5초 앞으로</button>
          </div>
        </article>

        <aside class="chat">
          <h3 style="margin: 0">실시간 채팅</h3>
          <div class="chat-log">
            <div class="chat-item"><strong>flowbox_admin</strong>: 이 장면부터 구조 분리 설명할게요.</div>
            <div class="chat-item"><strong>dabom_user</strong>: 네, 지금 따라가고 있습니다.</div>
            <div class="chat-item"><strong>frontend_note</strong>: 공통 컴포넌트 경계가 좋네요.</div>
          </div>
          <input class="chat-input" placeholder="메시지를 입력하세요" />
          <button class="btn btn-primary">전송</button>
        </aside>
      </section>
    </main>
  </body>
</html>
