<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Sample</title>
    <link rel="stylesheet" href="./message-sample.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="../2-main-explore/main-page-sample.html"><img src="../../src/assets/images/dabom2.png" alt="DaBom" /></a>
        <div class="topbar-title">메시지</div>
        <div class="auth-links"><a href="../1-auth/login-sample.html">로그인</a><a href="../1-auth/signup-sample.html">회원가입</a></div>
      </div>
    </header>

    <main class="main-content">
      <div class="messages-container">
        <aside class="chat-list">
          <div class="chat-list-header"><h2>메시지</h2></div>
          <div class="chat-search"><input class="chat-search-input" placeholder="대화 검색" /></div>
          <div class="chat-list-content">
            <article class="chat-item active">
              <img class="chat-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="chat-item-main">
                <div class="chat-item-top"><strong class="chat-item-name">FlowBox Studio</strong><span class="chat-item-time">오후 6:12</span></div>
                <p class="chat-item-last">채널 샘플 확인했습니다. 다음 섹션도 진행할게요.</p>
              </div>
            </article>
            <article class="chat-item">
              <img class="chat-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="chat-item-main">
                <div class="chat-item-top"><strong class="chat-item-name">frontend_note</strong><span class="chat-item-time">오후 4:03</span></div>
                <p class="chat-item-last">커뮤니티 카드 정렬 다시 볼까요?</p>
              </div>
            </article>
            <article class="chat-item">
              <img class="chat-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="chat-item-main">
                <div class="chat-item-top"><strong class="chat-item-name">dabom_user</strong><span class="chat-item-time">오전 11:20</span></div>
                <p class="chat-item-last">고마워요! 적용해볼게요.</p>
              </div>
            </article>
          </div>
        </aside>

        <section class="chat-window">
          <div class="chat-header">
            <div class="chat-header-info">
              <img class="chat-header-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="chat-header-details">
                <h3>FlowBox Studio</h3>
                <span class="chat-header-status">온라인</span>
              </div>
            </div>
            <div class="chat-actions">
              <button class="chat-action-btn"><i class="fas fa-phone"></i></button>
              <button class="chat-action-btn"><i class="fas fa-video"></i></button>
              <button class="chat-action-btn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
          </div>

          <div class="chat-messages">
            <div class="message">
              <img class="message-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="message-content-wrapper">
                <div class="message-content">안녕하세요. 채널 방문 페이지 업데이트 확인 부탁드립니다.</div>
                <span class="message-time">오후 6:09</span>
              </div>
            </div>
            <div class="message sent">
              <img class="message-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="message-content-wrapper">
                <div class="message-content">확인했습니다. 커뮤니티 상세도 추가해뒀습니다.</div>
                <span class="message-time">오후 6:10</span>
              </div>
            </div>
            <div class="message">
              <img class="message-avatar" src="../../src/assets/images/dabom2.png" alt="avatar" />
              <div class="message-content-wrapper">
                <div class="message-content">좋습니다. 다음은 DM/플레이리스트쪽 같이 보죠.</div>
                <span class="message-time">오후 6:12</span>
              </div>
            </div>
          </div>

          <div class="message-input-container">
            <div class="message-input-wrapper">
              <button class="input-btn"><i class="fas fa-paperclip"></i></button>
              <div class="message-input-area">
                <input class="message-input" placeholder="메시지를 입력하세요" />
                <button class="send-btn"><i class="fas fa-paper-plane"></i></button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
