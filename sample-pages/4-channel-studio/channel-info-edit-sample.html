<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DaBom - Mychannel Info Edit</title>
    <link rel="stylesheet" href="./mychannel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="top-left">
          <div class="brand"><img src="../../src/assets/images/dabom2.png" alt="DaBom logo" /></div>
          <nav class="top-nav">
            <a href="../2-main-explore/main-page-sample.html">홈</a>
            <a href="../5-together/together-main-sample.html">투게더</a>
            <a class="active" href="./mychannel.html">내 채널</a>
          </nav>
        </div>
        <div class="top-center">
          <div class="search-wrap">
            <input type="text" placeholder="검색어를 입력해주세요..." />
            <button>검색</button>
          </div>
        </div>
        <div class="top-right">
          <a href="../1-auth/login-sample.html" class="auth-btn">로그인</a>
          <a href="../1-auth/signup-sample.html" class="auth-btn">회원가입</a>
        </div>
      </div>
    </header>

    <section class="main-banner">
      <div class="banner-frame">
        <img src="../../src/assets/images/banner.png" alt="channel banner" class="banner-image" />
      </div>
    </section>

    <section class="channel-summary">
      <div class="channel-summary-card card">
        <div class="channel-profile">
          <img src="../../src/assets/images/dabom2.png" alt="channel profile" class="channel-avatar-lg" />
          <div class="channel-identity">
            <h1>FlowBox Studio</h1>
            <p>@flowbox_studio · 개발/프로덕트</p>
          </div>
        </div>
        <div class="channel-metrics">
          <div class="metric-item"><span class="metric-label">구독자</span><strong class="metric-value">12.8만</strong></div>
          <div class="metric-item"><span class="metric-label">동영상</span><strong class="metric-value">142개</strong></div>
          <div class="metric-item"><span class="metric-label">누적 조회수</span><strong class="metric-value">4,982,110</strong></div>
        </div>
      </div>
    </section>

    <div class="channel-dashboard">
      <aside class="dashboard-sidebar card">
        <a class="sidebar-btn" href="./mychannel.html">통합 대시보드</a>
        <a class="sidebar-btn" href="./video-management-sample.html">동영상 관리</a>
        <a class="sidebar-btn" href="./community-management-sample.html">커뮤니티 관리</a>
        <a class="sidebar-btn active" href="./channel-info-edit-sample.html">채널 정보 수정</a>
        <button class="sidebar-btn danger" type="button">회원 탈퇴</button>
      </aside>

      <main class="dashboard-main">
        <section class="dashboard-section card active">
          <div class="section-header info-head">
            <div>
              <h2>채널 정보 수정</h2>
              <p class="info-subtext">채널 소개와 이미지를 최신 상태로 관리하세요.</p>
            </div>
            <button class="btn-save" type="button">저장</button>
          </div>

          <form class="channel-info-form">
            <div class="info-panel">
              <label class="form-label">
                채널 설명
                <textarea rows="4" placeholder="창작과 영감을 나누는 공간입니다.">프론트엔드 리팩토링과 실전 UI 구조 개선을 다루는 채널입니다.</textarea>
              </label>
            </div>

            <div class="info-upload-grid">
              <label class="upload-field">
                <span>채널 프로필 이미지</span>
                <div class="upload-box">
                  <img src="../../src/assets/images/dabom2.png" alt="profile preview" />
                  <input type="file" accept="image/*" />
                </div>
              </label>

              <label class="upload-field">
                <span>배너(커버) 이미지</span>
                <div class="upload-box">
                  <img src="../../src/assets/images/banner.png" alt="banner preview" />
                  <input type="file" accept="image/*" />
                </div>
              </label>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
